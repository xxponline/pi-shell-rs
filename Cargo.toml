[package]
name = "pi-shell-rs"
version = "0.1.0"
edition = "2024"
default-run = "pi-shell-rs"

[dependencies]
crossterm = "0.29.0"
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5.3.0"
unicode-width = "0.2.3"
# GPUI 构建模式（feature `gpui-support`，默认关闭）：关闭时零依赖零行为变化
# （design D4）。gpui-kit 与宿主 balabala-agent-gui 同框架同版本（D1）——
# 钉死 =0.9.0：0.9.1 的 gpui-fast 0.1.14 链与 gpui-pre 0.3.12 链存在
# unicode-properties/taffy 解析冲突，宿主 0.9.0 配对（fast 0.1.13 + pre 0.3.11）已验证可解。
gpui-kit = { version = "=0.9.0", features = ["syntect", "test-support"], optional = true }
kameo = { version = "0.22.2", optional = true }
# tokio 仅随 gpui-support 启用：kameo actor 运行时 + #[tokio::test] 测试基座
# （kameo 0.22 本身就构建在 tokio 上，非新增传输面）
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"], optional = true }

[features]
# 默认关闭：不开此特性时不编译 gpui_agent 模块树、不链接 gpui-kit/kameo/tokio
gpui-support = ["dep:gpui-kit", "dep:tokio", "dep:kameo"]

[[bin]]
name = "probe"
path = "src/bin/probe/main.rs"

[[bin]]
name = "pi-shell-gpui"
path = "src/bin/gpui_window.rs"
required-features = ["gpui-support"]
